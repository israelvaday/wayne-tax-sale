name: Refresh bid options

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Live-check county STATUS / bids / views
        run: node scripts/refresh-options.mjs
      - name: Commit if the book moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/my-options.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Refresh live bid options from the county."
            git push
          fi
