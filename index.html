<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Wayne tax sale · Plottia desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand-row">
      <div>
        <h1>Wayne tax sale desk</h1>
        <p>County auction list scored against Plottia AVM, rent, and cash-flow math. Bid on the Treasurer site.</p>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="presets" id="presets"></div>

    <div class="controls">
      <input id="q" type="search" placeholder="Search address, parcel, owner, legal…" autofocus>
      <select id="city"><option value="">All cities</option></select>
      <select id="zip"><option value="">All ZIPs</option></select>
      <select id="match">
        <option value="">All matches</option>
        <option value="plottia">Plottia matched</option>
        <option value="unmatched">Unmatched</option>
      </select>
      <select id="occ">
        <option value="">All occupancy</option>
        <option value="OCCUPIED">Occupied</option>
        <option value="VACANT">Vacant</option>
        <option value="LAND">Land</option>
      </select>
      <button id="exportCsv" type="button">CSV</button>
    </div>
    <p class="hint">Scroll the list · <b>j</b>/<b>k</b> move · <b>Enter</b> open Plottia · <b>t</b> Treasurer · <b>m</b> map · <b>/</b> search</p>
  </header>

  <main class="desk">
    <section class="feed" id="feed"></section>
    <aside class="sheet" id="sheet">
      <p class="muted">Pick a parcel to see Plottia numbers and deal math.</p>
    </aside>
  </main>

  <footer>
    <span id="scrapedAt">…</span>
    · Not an official county site
  </footer>
  <script src="assets/app.js" type="module"></script>
</body>
</html>
